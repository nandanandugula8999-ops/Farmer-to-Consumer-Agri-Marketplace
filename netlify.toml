# Netlify configuration — static site, no build step required.
# The whole repository is served as-is from the project root.

[build]
  publish = "."
  command = ""

# Basic security headers for the static demo.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
